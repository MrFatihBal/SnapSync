<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SnapSync Field</title>
<meta name="description" content="SnapSync Field — saha belge toplama uygulaması. Tanıtım belgesi." />
<style>
/* ──────────────────────────────────────────────────────────────
   SnapSync Field — tanitim belgesi.

   Tamamen beyaz, A4, her bolum kendi sayfasinda: solda anlatim,
   sagda ekran. Turuncu yalnizca vurgu icin, marka kilavuzundaki
   gibi az ve anlamli.

   ?lang=en  -> Ingilizce
   Ctrl+P -> PDF olarak kaydet
   ────────────────────────────────────────────────────────────── */
:root {
  --orange:     #FF6600;
  --dark:       #363636;
  --grey-mid:   #848484;
  --grey-soft:  #AAAAAA;
  --grey-light: #C8C8C8;
  --red:        #AB2328;
  --hair:       #E6E6E6;
  --paper:      #FFFFFF;
}

@page { size: A4; margin: 17mm 16mm; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--dark);
  font: 400 13px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.12; letter-spacing: -.022em; }
p { margin: 0; }

.sheet { width: 700px; margin: 0 auto; }

/* Her bolum kendi sayfasinda. */
.page {
  break-after: page;
  min-height: 940px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 28px 0;
}
.page:last-child { break-after: auto; }

/* ── Kapak ──────────────────────────────────────────────────── */
.cover { justify-content: space-between; }
.cover-top { display: flex; align-items: flex-start; justify-content: space-between; }
.mark { position: relative; font-size: 30px; font-weight: 900; letter-spacing: .02em; color: var(--dark); }
.mark::after { content: ""; position: absolute; right: -10px; top: -5px; bottom: -5px; width: 3px; background: var(--orange); }
.cover-kind { font-size: 10.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--grey-mid); padding-top: 10px; }

.cover-mid { padding: 56px 0; }
.cover-rule { width: 64px; height: 4px; background: var(--orange); margin-bottom: 30px; }
.cover h1 { font-size: 58px; font-weight: 900; }
.cover h1 em { font-style: normal; color: var(--orange); }
.cover-lead { margin-top: 24px; font-size: 18px; line-height: 1.6; color: #4A4A4A; max-width: 30em; }

.cover-foot { display: flex; gap: 56px; border-top: 1px solid var(--hair); padding-top: 22px; }
.cover-foot div b { display: block; font-size: 17px; font-weight: 900; }
.cover-foot div span { font-size: 11.5px; color: var(--grey-mid); }

/* ── Bolum basligi ──────────────────────────────────────────── */
.num {
  font-size: 11px; font-weight: 900; letter-spacing: .22em;
  color: var(--orange); margin-bottom: 14px;
}
.page h2 { font-size: 34px; font-weight: 900; }
.page > .lead { margin-top: 16px; font-size: 15px; line-height: 1.65; color: #4A4A4A; max-width: 44em; }

/* ── Ekran bolumu: solda anlatim, sagda cihaz ───────────────── */
.split { display: grid; grid-template-columns: 1fr 236px; gap: 46px; align-items: center; }
.split-text h2 { font-size: 30px; }
.split-text .lead { margin-top: 14px; font-size: 14px; line-height: 1.7; color: #4A4A4A; }

.points { list-style: none; margin: 26px 0 0; padding: 0; }
.points li {
  position: relative; padding-left: 22px; margin-bottom: 13px;
  font-size: 13px; line-height: 1.6; color: #4A4A4A;
}
.points li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  border: 2px solid var(--orange);
}
.points li b { color: var(--dark); font-weight: 800; }

.aside {
  margin-top: 26px; padding: 15px 18px;
  background: #FAFAFA; border-left: 3px solid var(--orange);
  font-size: 12.5px; line-height: 1.6; color: #4A4A4A;
}
.aside b { color: var(--dark); font-weight: 800; }

/* ── Deger kartlari ─────────────────────────────────────────── */
.values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.value { border-top: 3px solid var(--orange); padding-top: 18px; }
.value h3 { font-size: 17px; font-weight: 900; margin-bottom: 9px; }
.value p { font-size: 12.5px; line-height: 1.65; color: #4A4A4A; }

/* ── Akis tablosu ───────────────────────────────────────────── */
.flows { margin-top: 36px; border-top: 2px solid var(--dark); }
.frow { display: grid; grid-template-columns: 150px 1fr; gap: 28px; padding: 20px 0; border-bottom: 1px solid var(--hair); }
.frow h4 { font-size: 17px; font-weight: 900; }
.frow h4 span { display: block; font-size: 11.5px; font-weight: 600; color: var(--grey-mid); margin-top: 5px; letter-spacing: 0; }
.fsteps { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fstep {
  font-size: 12px; font-weight: 700; color: var(--dark);
  background: #F7F7F7; border: 1px solid var(--hair);
  padding: 7px 13px; border-radius: 999px;
}
.farrow { color: var(--grey-soft); font-size: 13px; }
.fnote { margin-top: 10px; font-size: 12px; color: var(--grey-mid); }

/* ── Kapanis ────────────────────────────────────────────────── */
.close-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 34px; margin-top: 36px; }
.close-item { display: flex; gap: 14px; }
.close-item b { color: var(--orange); font-size: 20px; font-weight: 900; line-height: 1.2; }
.close-item div p:first-child { font-weight: 800; font-size: 14px; margin-bottom: 3px; }
.close-item div p:last-child { font-size: 12.5px; color: #4A4A4A; line-height: 1.6; }

.endnote {
  margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--hair);
  font-size: 11.5px; color: var(--grey-mid);
}

/* ══════════════════════════════════════════════════════════════
   Cihaz maketleri — uygulamadaki ekranlarin birebir karsiligi
   ══════════════════════════════════════════════════════════════ */
.device { width: 236px; border-radius: 28px; padding: 9px; background: #1A1A1A; }
.screen { border-radius: 20px; overflow: hidden; background: #fff; height: 472px; display: flex; flex-direction: column; position: relative; }
.screen.dark { background: var(--dark); }

.sbar { height: 20px; flex: 0 0 20px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px; font-size: 8px; font-weight: 700; color: var(--grey-mid); }
.screen.dark .sbar { color: rgba(255,255,255,.55); }

.m-pad { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }

.m-hero { height: 94px; flex: 0 0 94px; position: relative; background: linear-gradient(135deg, #4A4A4A, #262626); display: grid; place-items: center; }
.m-hero > span { color: #fff; font-weight: 900; font-size: 12px; letter-spacing: .04em; }
.m-hero::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 8px; height: 2px; background: var(--orange); opacity: .85; }
.m-heroswitch { position: absolute; top: 7px; right: 8px; font-size: 6.5px; font-weight: 800; color: #fff; background: rgba(54,54,54,.72); border: 1px solid rgba(255,255,255,.35); padding: 2px 6px; border-radius: 999px; }

.m-card { border: 1px solid var(--grey-light); border-radius: 7px; padding: 8px; background: #fff; display: flex; flex-direction: column; gap: 3px; }
.m-k { font-size: 7px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--grey-mid); }
.m-v { font-size: 10.5px; font-weight: 800; color: var(--dark); }
.m-row { display: flex; gap: 7px; }
.m-row > * { flex: 1; }

.m-btn { background: var(--orange); color: #fff; text-align: center; padding: 9px 5px; border-radius: 6px; font-weight: 800; font-size: 9px; line-height: 1.2; }
.m-btn.sec { background: #fff; color: var(--dark); border: 1px solid var(--grey-light); }

.bars { display: flex; align-items: center; gap: 2px; }
.bars i { display: block; background: rgba(255,255,255,.6); border-radius: 1px; height: 46px; }
.beam { position: absolute; left: 0; right: 0; top: 0; }
.beam::before { content: ""; position: absolute; left: 0; right: 0; top: -22px; height: 44px; background: var(--orange); opacity: .14; }
.beam::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--orange); }

.corner { position: absolute; width: 24px; height: 24px; border: 0 solid var(--orange); }
.c-tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 8px; }
.c-tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
.c-bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
.c-br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 8px; }

.m-login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.m-logo { font-size: 21px; font-weight: 900; color: #fff; position: relative; }
.m-logo::after { content: ""; position: absolute; right: -6px; top: -3px; bottom: -3px; width: 2px; background: var(--orange); }
.m-scanbox { position: relative; width: 100%; height: 76px; border-radius: 8px; background: rgba(255,255,255,.05); overflow: hidden; display: grid; place-items: center; }
.m-scanbox .beam { top: 38px; }
.m-title { font-size: 17px; font-weight: 900; color: #fff; }

.m-cam { flex: 1; position: relative; background: #2A2A2A; display: grid; place-items: center; }
.m-retic { position: relative; width: 136px; height: 86px; }
.m-retic > i { position: absolute; width: 18px; height: 18px; border: 0 solid var(--orange); }
.m-retic > i:nth-of-type(1) { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
.m-retic > i:nth-of-type(2) { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
.m-retic > i:nth-of-type(3) { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
.m-retic > i:nth-of-type(4) { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }
.m-barcode { position: absolute; inset: 18px 12px; display: flex; gap: 2px; align-items: stretch; }
.m-barcode b { display: block; background: rgba(255,255,255,.85); border-radius: 1px; }

.m-repbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; border-bottom: 1px solid var(--grey-light); }
.m-accent { width: 3px; align-self: stretch; min-height: 24px; border-radius: 2px; background: var(--orange); }
.m-repinfo { flex: 1; min-width: 0; }
.m-repno { font-size: 10px; font-weight: 900; color: var(--dark); font-family: ui-monospace, Menlo, Consolas, monospace; }
.m-stepbadge { text-align: right; flex: 0 0 auto; }
.m-stepbadge b { display: block; font-size: 10px; font-weight: 900; color: var(--orange); }
.m-stepbadge span { font-size: 6.5px; color: var(--grey-mid); font-weight: 700; }

.m-live { flex: 1; position: relative; background: #2E2E2E; overflow: hidden; }
.m-live::before { content: ""; position: absolute; inset: 17% 13%; border-radius: 3px; background: linear-gradient(150deg, #6A6A6A, #4A4A4A); }
.m-live::after { content: ""; position: absolute; inset: 17% 13%; background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255,255,255,.15) 6px 7px); }

.m-strip { flex: 0 0 auto; display: flex; gap: 5px; padding: 8px 10px; background: #fff; border-top: 1px solid var(--grey-light); min-height: 46px; align-items: center; }
.m-sthumb { position: relative; width: 29px; height: 29px; border-radius: 4px; background: linear-gradient(140deg, #D8D8D8, #ECECEC); border: 1px solid var(--grey-light); }
.m-sthumb i { position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 6.5px; font-weight: 900; font-style: normal; display: grid; place-items: center; }

.m-acts { display: flex; gap: 6px; padding: 9px 10px 11px; background: #fff; }
.m-acts > * { flex: 1; }

.m-edtop { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; background: #fff; border-bottom: 1px solid var(--grey-light); }
.m-edtop span { font-size: 8px; font-weight: 800; color: var(--grey-mid); white-space: nowrap; }
.m-edtop b { font-size: 9px; font-weight: 900; color: var(--dark); white-space: nowrap; }
.m-edtop .save { color: var(--orange); }
.m-edstage { flex: 1; position: relative; background: #2A2A2A; padding: 12px; }
.m-edphoto { position: relative; width: 100%; height: 100%; background: linear-gradient(150deg, #8A8A8A, #5C5C5C); border-radius: 2px; }
.m-edphoto::after { content: ""; position: absolute; inset: 14%; background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255,255,255,.18) 6px 7px); }
.m-edcrop { position: absolute; inset: 16% 12% 22% 12%; border: 1px solid rgba(255,255,255,.9); box-shadow: 0 0 0 9999px rgba(54,54,54,.5); }
.m-edcrop i { position: absolute; width: 13px; height: 13px; border: 0 solid var(--orange); }
.m-edcrop i:nth-of-type(1) { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; }
.m-edcrop i:nth-of-type(2) { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; }
.m-edcrop i:nth-of-type(3) { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; }
.m-edcrop i:nth-of-type(4) { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; }
.m-edhint { text-align: center; font-size: 7px; color: rgba(255,255,255,.65); padding: 7px 9px; background: var(--dark); }
.m-edtools { display: flex; gap: 6px; padding: 9px 10px 11px; background: var(--dark); }
.m-edtools > * { flex: 1; text-align: center; padding: 8px; border-radius: 6px; font-size: 8.5px; font-weight: 800; border: 1px solid rgba(255,255,255,.28); color: #fff; }
.m-edtools .del { border-color: color-mix(in srgb, var(--red) 70%, #fff); color: #FF8A8F; }

.m-list { display: flex; flex-direction: column; gap: 6px; }
.m-item { border: 1px solid var(--grey-light); border-radius: 7px; padding: 7px; display: flex; flex-direction: column; gap: 4px; }
.m-item .no { font-size: 9.5px; font-weight: 900; color: var(--dark); font-family: ui-monospace, Menlo, Consolas, monospace; }
.m-item .mt { font-size: 7.5px; color: var(--grey-mid); }
.m-retrybar { background: color-mix(in srgb, var(--orange) 12%, #fff); border: 1px solid color-mix(in srgb, var(--orange) 35%, #fff); color: var(--orange); font-size: 8.5px; font-weight: 800; padding: 6px; border-radius: 6px; text-align: center; }
.m-pill { align-self: flex-start; font-size: 7.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--orange) 14%, #fff); color: var(--orange); }
.m-pill.err { background: color-mix(in srgb, var(--red) 11%, #fff); color: var(--red); }

/* Baskida yazdirilabilir alan ne ise o: A4 eksi kenar bosluklari. */
@media print {
  .sheet { width: 100%; }
}

/* Ekranda sayfalari kagit gibi gosteriyoruz; PDF cikisini etkilemez. */
@media screen {
  body { background: #EFEFEF; padding: 24px 0; }
  .sheet { width: 794px; }
  .page { background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.09); margin-bottom: 20px; padding: 42px 46px; }
}
</style>
</head>

        ["Transitnet", "Depo operasyonu", ["Barkodu okut", "Operasyon fotoğrafları", "Gönder"], "Tek sayfa. Operasyon etiketi harf içerebilir."],
        ["MSM", "Food İstanbul", ["Barkodu okut", "Numune fotoğrafı", "Belge fotoğrafı", "Gönder"], "İki aşama. Ekranlar numune kabul ile aynı işler."]
      ],

      clNum: "ÖZET",
      clTitle: "Sahadan kazanılan nedir",
      cl: [
        ["Zaman", "Numara yazmak, form doldurmak ve gün sonunda aktarım yapmak akıştan çıkar."],
        ["Doğruluk", "Numara okutularak alınır, hedef sistem otomatik belirlenir; iki yaygın hata kaynağı kapanır."],
        ["Süreklilik", "Kapsama dışı alanlar işi durdurmaz; kayıtlar kaybolmadan bekler."],

    en: {
      kind: "Overview",
      title: 'Scan it. Shoot it.<br><em>The app does the rest.</em>',
      lead: "SnapSync Field is the mobile application field staff use to capture document photos in a single flow and deliver them to SGS systems.",
      f1: "Offline", f1d: "Never waits for signal",
      f2: "Three actions", f2d: "Scan, shoot, done",
      f3: "No training", f3d: "The screen adapts itself",

      ovNum: "OVERVIEW",
      ovTitle: "A flow that turns time on site into finished work",
      ovLead: "Field staff carry one application, and it already knows what to do. It does not ask which project they are on, which station they are at, or how many photos are needed — it reads that from their assignment and opens the right screen.",
      v1: "One flow", v1d: "Scan the barcode, take the photos, send. No forms to fill in, no lists to pick from, no boxes to tick.",
      v2: "Uninterrupted", v2d: "Works out of coverage. The record is finalised on the device and delivers itself once a connection returns.",
      v3: "Routed correctly", v3d: "Staff never choose a destination system. Filing a record in the wrong place is designed out of the flow.",

            "Changes of assignment flow through the corporate account."],

      s3n: "03 — SCANNING", s3t: "No more typing numbers",
      s3l: "The camera opens, the barcode goes inside the frame, and the number is read in seconds. The app validates what it reads against the station's rules, so it will not pick up the wrong label from a row of them.",
      s3p: ["Misreads are reduced by <b>the frame and a double confirmation</b>.",
            "If the label is damaged, the number can be typed in instead.",
            "Once read, the number is locked and cannot change by accident."],

      s4n: "04 — CAPTURE", s4t: "As many photos as the document needs",

            "A failed upload is never lost — it is retried.",
            "Once delivered, the device's copy of the photo is removed."],

      flNum: "FLOW BY STATION",
      flTitle: "One application, four ways of working",
      flLead: "The screens staff see depend on their assignment. The differences below are applied automatically, without the user choosing anything.",
      fl: [

      ],

      clNum: "SUMMARY",
      clTitle: "What the field gains",

        ["Data cost", "Photos are reduced on the device before they are sent."],
        ["Adoption", "A three-action flow; the training burden for new staff is minimal."]
      ],
      endnote: "SGS Türkiye internal application. This document is for presentation purposes."
    }
  };

  var x = T[lang];

  var UI = lang === "tr"
    ? { signin: "Microsoft ile Giriş Yap", staff: "Personel", ps: "Proje · İstasyon",
        today: "Bugün", rec: "6 kayıt", photos: "Fotoğraf", start: "Yeni İşlem Başlat",
        queue: "Gönderim Kuyruğu", manual: "Barkodu Elle Gir", repno: "Rapor Numarası",
        take: "Fotoğraf Çek", next: "Sonraki Aşama", send: "Gönder (3)",
        change: "değiştir", cancel: "Vazgeç", save: "Kaydet", edit: "Fotoğrafı Düzenle",
        hint: "Köşeleri sürükleyip alanı ayarlayın", rotate: "Döndür", del: "Sil",
        retry: "2 bekliyor · Tekrar dene", waiting: "Bekliyor", err: "Hata · Tekrar dene",
        nph: "fotoğraf", step1: "Numune Fotoğrafları", station: "Numune Kabul" }
    : { signin: "Sign in with Microsoft", staff: "Staff", ps: "Project · Station",
        today: "Today", rec: "6 records", photos: "Photos", start: "Start New Job",
        queue: "Upload Queue", manual: "Enter Barcode Manually", repno: "Report Number",
        take: "Take Photo", next: "Next Stage", send: "Send (3)",
        change: "change", cancel: "Cancel", save: "Save", edit: "Edit Photo",
        hint: "Drag the corners to set the area", rotate: "Rotate", del: "Delete",
        retry: "2 waiting · Retry", waiting: "Waiting", err: "Failed · Retry",
        nph: "photos", step1: "Sample Photos", station: "Sample Reception" };

  /* ── Ekranlar ───────────────────────────────────────────────── */
  var SCREENS = {
    signin: dev(
      '<div class="m-login"><div class="m-logo">SGS</div>' +
      '<div class="m-scanbox"><div class="bars">' + bars(16, 2, "i", 44) + "</div>" +
      '<div class="beam"></div><i class="corner c-tl"></i><i class="corner c-tr"></i>' +
      '<i class="corner c-bl"></i><i class="corner c-br"></i></div>' +
      '<div class="m-title">SnapSync</div>' +
      '<div class="m-btn" style="width:100%">' + UI.signin + "</div></div>", true),

    home: dev(
      '<div class="m-hero"><span>SGS</span><div class="m-heroswitch">7/18 · ' + UI.change + "</div></div>" +
      '<div class="m-pad">' +
        '<div class="m-card"><div class="m-k">' + UI.staff + '</div><div class="m-v">Fatih Bal</div>' +
          '<div class="m-k" style="margin-top:4px">' + UI.ps + '</div><div class="m-v">' + UI.station + "</div></div>" +
        '<div class="m-row">' +
          '<div class="m-card"><div class="m-k">' + UI.today + '</div><div class="m-v">' + UI.rec + "</div></div>" +
          '<div class="m-card"><div class="m-k">' + UI.photos + '</div><div class="m-v">14</div></div>' +
        "</div>" +
        '<div class="m-btn">' + UI.start + "</div>" +
        '<div class="m-btn sec">' + UI.queue + "</div>" +
      "</div>"),

    scan: dev(
      '<div class="m-cam"><div class="m-retic"><div class="m-barcode">' + bars(15, 2, "b") + "</div>" +
      "<i></i><i></i><i></i><i></i></div></div>" +
      '<div style="padding:10px"><div class="m-btn sec">' + UI.manual + "</div></div>", true),

    capture: dev(
      '<div class="m-repbar"><div class="m-accent"></div>' +
        '<div class="m-repinfo"><div class="m-k">' + UI.repno + '</div><div class="m-repno">' + NO + "</div></div></div>" +
      '<div class="m-live"></div>' +
      '<div class="m-strip"><div class="m-sthumb"><i>1</i></div><div class="m-sthumb"><i>2</i></div>' +
        '<div class="m-sthumb"><i>3</i></div></div>' +
      '<div class="m-acts"><div class="m-btn">' + UI.take + '</div><div class="m-btn sec">' + UI.send + "</div></div>"),

    staged: dev(
      '<div class="m-repbar"><div class="m-accent"></div>' +
        '<div class="m-repinfo"><div class="m-k">' + UI.repno + '</div><div class="m-repno">' + NO + "</div></div>" +
        '<div class="m-stepbadge"><b>1/2</b><span>' + UI.step1 + "</span></div></div>" +
      '<div class="m-live"></div>' +
      '<div class="m-strip"><div class="m-sthumb"><i>1</i></div></div>' +
      '<div class="m-acts"><div class="m-btn">' + UI.take + '</div><div class="m-btn sec">' + UI.next + "</div></div>"),

    editor: dev(
      '<div class="m-edtop"><span>' + UI.cancel + '</span><b>' + UI.edit + '</b>' +
        '<span class="save">' + UI.save + "</span></div>" +
      '<div class="m-edstage"><div class="m-edphoto"><div class="m-edcrop">' +
        "<i></i><i></i><i></i><i></i></div></div></div>" +
      '<div class="m-edhint">' + UI.hint + "</div>" +
      '<div class="m-edtools"><div>' + UI.rotate + '</div><div class="del">' + UI.del + "</div></div>", true),

    queue: dev(
      '<div class="m-pad">' +
        '<div class="m-v" style="font-size:12px">' + UI.queue + "</div>" +
        '<div class="m-retrybar">' + UI.retry + "</div>" +
        '<div class="m-list">' +
          '<div class="m-item"><div class="no">26TR341300306412</div>' +
            '<div class="mt">5 ' + UI.nph + ' · 14:22</div><div class="m-pill">' + UI.waiting + "</div></div>" +
          '<div class="m-item"><div class="no">26TR341300306418</div>' +
            '<div class="mt">2 ' + UI.nph + ' · 14:30</div><div class="m-pill err">' + UI.err + "</div></div>" +
        "</div></div>")
  };

  /* ── Sayfalar ───────────────────────────────────────────────── */
  function split(n, key, screen) {
    var points = x[key + "p"].map(function (p) { return "<li>" + p + "</li>"; }).join("");
    var aside = x[key + "a"] ? '<div class="aside">' + x[key + "a"] + "</div>" : "";
    return '<section class="page"><div class="split">' +
      '<div class="split-text">' +
        '<div class="num">' + x[key + "n"] + "</div>" +
        "<h2>" + x[key + "t"] + "</h2>" +
        '<p class="lead">' + x[key + "l"] + "</p>" +
        '<ul class="points">' + points + "</ul>" + aside +
      "</div>" +
      "<div>" + screen + "</div>" +
      "</div></section>";
  }

  var html = "";

  /* Kapak */
  html += '<section class="page cover">' +
    '<div class="cover-top"><div class="mark">SGS</div>' +
      '<div class="cover-kind">' + x.kind + "</div></div>" +
    '<div class="cover-mid"><div class="cover-rule"></div>' +
      "<h1>" + x.title + "</h1>" +
      '<p class="cover-lead">' + x.lead + "</p></div>" +
    '<div class="cover-foot">' +
      "<div><b>" + x.f1 + "</b><span>" + x.f1d + "</span></div>" +
      "<div><b>" + x.f2 + "</b><span>" + x.f2d + "</span></div>" +
      "<div><b>" + x.f3 + "</b><span>" + x.f3d + "</span></div>" +
    "</div></section>";

  /* Genel bakis */
  html += '<section class="page">' +
    '<div class="num">' + x.ovNum + "</div><h2>" + x.ovTitle + "</h2>" +
    '<p class="lead">' + x.ovLead + "</p>" +
    '<div class="values">' +
      "<div class='value'><h3>" + x.v1 + "</h3><p>" + x.v1d + "</p></div>" +
      "<div class='value'><h3>" + x.v2 + "</h3><p>" + x.v2d + "</p></div>" +
      "<div class='value'><h3>" + x.v3 + "</h3><p>" + x.v3d + "</p></div>" +
    "</div></section>";

  /* Ekranlar */
  html += split(1, "s1", SCREENS.signin);
  html += split(2, "s2", SCREENS.home);
  html += split(3, "s3", SCREENS.scan);
  html += split(4, "s4", SCREENS.capture);
  html += split(5, "s5", SCREENS.staged);
  html += split(6, "s6", SCREENS.editor);
  html += split(7, "s7", SCREENS.queue);

  /* Istasyona gore akis */
  html += '<section class="page">' +
    '<div class="num">' + x.flNum + "</div><h2>" + x.flTitle + "</h2>" +
    '<p class="lead">' + x.flLead + "</p>" +
    '<div class="flows">' + x.fl.map(function (f) {
      var chips = f[2].map(function (s) { return '<span class="fstep">' + s + "</span>"; })
        .join('<span class="farrow">→</span>');
      return '<div class="frow"><h4>' + f[0] + "<span>" + f[1] + "</span></h4>" +
        '<div><div class="fsteps">' + chips + '</div><p class="fnote">' + f[3] + "</p></div></div>";
    }).join("") + "</div></section>";

  /* Ozet */
  html += '<section class="page">' +
    '<div class="num">' + x.clNum + "</div><h2>" + x.clTitle + "</h2>" +
    '<div class="close-grid">' + x.cl.map(function (c, i) {
      return '<div class="close-item"><b>' + ("0" + (i + 1)).slice(-2) + "</b>" +
        "<div><p>" + c[0] + "</p><p>" + c[1] + "</p></div></div>";
    }).join("") + "</div>" +
    '<div class="endnote">' + x.endnote + "</div></section>";

  document.getElementById("sheet").innerHTML = html;
})();
</script>
